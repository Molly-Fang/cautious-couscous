<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>那些年我们一起唱过的诗</title>
    <!-- Font Awesome 6 (简洁图标) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #F7F2DC 0%, #DAEAE5 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', 'Noto Sans', sans-serif;
            padding: 24px 20px 40px;
            min-height: 100vh;
            color: #4a3b2c;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
        }

        /* 头部区域 */
        .poetry-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .poetry-header h1 {
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #c7a27b, #e3c299);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 12px;
            text-shadow: 2px 2px 12px rgba(150, 110, 70, 0.12);
        }
        .header-icon {
    font-size: 2rem;
    margin-bottom: 8px;
    display: flex;
    justify-content: center;
    gap: 18px;
    color: #c1a176;
    margin-top: 24px;
    margin-left: -5px;
    border-top-left-radius: 0px;
    min-width: 1px;
    letter-spacing: 12px;
        }
        .scripture-sub {
            font-size: 0.95rem;
            color: #7f6b53;
            background: rgba(252, 247, 235, 0.6);
            backdrop-filter: blur(2px);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 60px;
            letter-spacing: 0.5px;
            font-weight: 450;
            max-width: 90%;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .scripture-sub i {
            margin-right: 6px;
            color: #b8a17f;
        }

        /* 卡片样式：标题 + 音频控件 + 简易错误提示 */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .poem-card {
            background: rgba(255, 252, 245, 0.9);
            border-radius: 28px;
            padding: 18px 20px;
            box-shadow: 0 4px 12px rgba(100, 75, 50, 0.06);
            transition: all 0.2s ease;
            border: 1px solid rgba(245, 230, 210, 0.8);
        }
        .poem-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: #5d4430;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            padding-left: 4px;
            border-left: 4px solid #e2c29b;
            line-height: 1.3;
        }
        .audio-control {
            width: 100%;
            margin-top: 4px;
        }
        audio {
            width: 100%;
            height: 44px;
            border-radius: 40px;
            outline: none;
            background: #fdf8ef;
        }
        /* 错误提示简洁样式 */
        .audio-error {
            font-size: 0.7rem;
            color: #c0825e;
            margin-top: 8px;
            background: #fef1e6;
            border-radius: 40px;
            padding: 4px 12px;
            display: inline-block;
        }
        @media (max-width: 480px) {
            body {
                padding: 18px 16px 32px;
            }
            .poem-card {
                padding: 14px 16px;
            }
            .poem-title {
                font-size: 1.2rem;
            }
            audio {
                height: 42px;
            }
        }

        /* 底部小绵羊 */
        .sheep-footer {
            margin-top: 48px;
            text-align: center;
            font-size: 0.85rem;
            color: #7b6a53;
            background: rgba(250, 245, 235, 0.7);
            backdrop-filter: blur(3px);
            border-radius: 80px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            border: 1px solid rgba(215, 190, 155, 0.4);
            line-height: 1.4;
        }
        .sheep-footer .lamb-icon {
            font-size: 1.6rem;
        }
        .sheep-footer .scripture-text {
            font-weight: 500;
            color: #5f4e39;
        }
        .sheep-footer .verse-ref {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #dfd3c2;
        }
        ::-webkit-scrollbar-thumb {
            background: #c7b18f;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="poetry-header">
        <div class="header-icon">
            <i class="fas fa-book-open 1"></i>
            <i class="fas fa-cross"></i>
        </div>
        <h1>那些年我们一起唱过的诗</h1>
        <div class="scripture-sub">
            <i class="fas fa-dove"></i> 耶和华是我的力量，是我的诗歌，他也成了我的拯救
        </div>
    </div>

    <div id="poemList" class="song-list"></div>

    <div class="sheep-footer">
        <span class="lamb-icon">🐑💧</span>
        <span class="scripture-text">他使我躺卧在青草地上，领我在可安歇的水边。<br>他使我的灵魂苏醒，为自己的名引导我走义路。</span>
        <span class="verse-ref">(诗篇 23:2-3)</span>
        <span class="lamb-icon">✨🌿</span>
    </div>
	<div class="audio-control">
	
	</div>
</div>

<script>
    // ============================================================
    // 十首诗歌标题（完全依照用户指定）
    // 【重要】请将下方示例音频直链替换为您自己的永久有效直链
    // 为保证播放成功，请注意：
    // 1. 音频链接必须是 https:// 开头，避免混合内容拦截
    // 2. 建议使用支持 CORS 的托管平台（如 Pages Drop 注册后获取的链接、Catbox.moe 等）
    // 3. 如果遇到跨域问题，可尝试在 audio 标签上已内置 crossorigin="anonymous" 属性
    // 4. 点击播放按钮需用户手动触发（浏览器策略要求），本页面完全遵循
    // ============================================================
    const poems = [
        { title: "遇见你们", audioUrl:"https://raw.githubusercontent.com/Molly-Fang/cautious-couscous/main/%E9%81%87%E8%A7%81%E4%BD%A0%E4%BB%AC.mp3" },
        { title: "不是我，乃是基督在我里面活", 
		 audioUrl: "https://raw.githubusercontent.com/Molly-Fang/cautious-couscous/main/%E4%B8%8D%E6%98%AF%E6%88%91.mp3" },
		
        { title: "献上自己为祭",
		 audioUrl: "https://raw.githubusercontent.com/Molly-Fang/cautious-couscous/main/%E7%8C%AE%E4%B8%8A%E8%87%AA%E5%B7%B1%E4%B8%BA%E7%A5%AD.mp3" },
        { title: "刚好", 
		 audioUrl: "https://raw.githubusercontent.com/Molly-Fang/cautious-couscous/main/%E5%88%9A%E5%A5%BD.mp3" },
        { title: "唱一首锡安之歌", 
		 audioUrl: "https://raw.githubusercontent.com/Molly-Fang/cautious-couscous/main/%E5%94%B1%E4%B8%80%E9%A6%96%E9%94%A1%E5%AE%89%E4%B9%8B%E6%AD%8C.mp3" },
        { title: "拣选", 
		 audioUrl: "https://raw.githubusercontent.com/Molly-Fang/cautious-couscous/main/%E6%8B%A3%E9%80%89.mp3" },
        { title: "耶和华是爱", 
		 audioUrl: "https://raw.githubusercontent.com/Molly-Fang/cautious-couscous/main/%E8%80%B6%E5%92%8C%E5%8D%8E%E6%98%AF%E7%88%B1.mp3" },
        { title: "奇异恩典", 
		 audioUrl: "https://raw.githubusercontent.com/Molly-Fang/cautious-couscous/main/%E5%A5%87%E5%BC%82%E6%81%A9%E5%85%B8.mp3" },
        { title: "谁能使我与神的爱隔绝", 
		 audioUrl: "https://raw.githubusercontent.com/Molly-Fang/cautious-couscous/main/%E8%B0%81%E8%83%BD%E4%BD%BF%E6%88%91%E4%B8%8E%E7%A5%9E%E7%9A%84%E7%88%B1%E9%9A%94%E7%BB%9D.mp3" },
        
    ];

    // 辅助：防XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 创建卡片并绑定音频错误提示
    function renderPoems() {
        const container = document.getElementById('poemList');
        if (!container) return;
        container.innerHTML = '';

        poems.forEach((poem, idx) => {
            const card = document.createElement('div');
            card.className = 'poem-card';

            // 标题
            const titleDiv = document.createElement('div');
            titleDiv.className = 'poem-title';
            titleDiv.textContent = escapeHtml(poem.title);

            // 音频控件区域
            const audioWrapper = document.createElement('div');
            audioWrapper.className = 'audio-control';
            
            const audioElem = document.createElement('audio');
            audioElem.controls = true;
            audioElem.preload = 'metadata';
            // 关键：添加 crossorigin 属性以请求 CORS 许可，可部分解决跨域问题
            audioElem.setAttribute('crossorigin', 'anonymous');
            // 设置音频源
            if (poem.audioUrl && poem.audioUrl.trim() !== '') {
                audioElem.src = poem.audioUrl;
            } else {
                // 如果没有提供直链，显示一个无效占位（但仍给出控件）
                audioElem.src = '';
            }
            audioElem.preload = "none";
            // 错误提示容器（动态显示加载失败）
            const errorSpan = document.createElement('div');
            errorSpan.className = 'audio-error';
            errorSpan.style.display = 'none';
            errorSpan.innerHTML = '<i class="fas fa-exclamation-triangle"></i> 音频加载失败，请检查直链或网络';
            
            // 监听音频错误事件
            audioElem.addEventListener('error', (e) => {
                console.warn(`[音频错误] ${poem.title} 无法加载: ${audioElem.src}`);
                // 显示友好错误提示
                errorSpan.style.display = 'inline-block';
                // 可选：稍后自动隐藏，但保留提示更好
            });
            
            // 当成功加载（可以播放）时隐藏错误提示
            audioElem.addEventListener('canplaythrough', () => {
                errorSpan.style.display = 'none';
            });
            
            // 重新设置 src 时重置错误提示（有些情况下用户替换直链后刷新）
            audioElem.addEventListener('loadstart', () => {
                errorSpan.style.display = 'none';
            });
            
            audioWrapper.appendChild(audioElem);
            audioWrapper.appendChild(errorSpan);
            
            card.appendChild(titleDiv);
            card.appendChild(audioWrapper);
            container.appendChild(card);
        });
    }
    
    // 页面启动
    renderPoems();
    
    // 额外增强：如果浏览器因为自动策略导致首次点击无声音，但用户手动点击音频控件即可。
    // 此处无额外自动播放代码，完全遵从用户手势。
    console.log('页面已加载，音频控件需要用户主动点击播放。请确保每个audioUrl为有效直链且支持CORS。');
</script>
</body>
</html>
